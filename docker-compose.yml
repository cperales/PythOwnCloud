services:
  pythowncloud:
    build: .
    container_name: pythowncloud-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ${POC_DATA_FOLDER}:/data
      - ${POC_DB_PATH_DIR}:/db
    environment:
      - POC_API_KEY=${POC_API_KEY}
      - POC_STORAGE_PATH=/data
      - POC_LOGIN_PASSWORD_HASH=${POC_LOGIN_PASSWORD_HASH}
      - POC_SESSION_TTL_DAYS=7
      - POC_DB_PATH_DIR=/db
      - POC_S3_ACCESS_KEY=${POC_S3_ACCESS_KEY:-pythowncloud}
      - POC_S3_SECRET_KEY=${POC_S3_SECRET_KEY}
      - POC_S3_MAX_CONCURRENT_UPLOADS=${POC_S3_MAX_CONCURRENT_UPLOADS:-2}
      - POC_S3_UPLOAD_QUEUE_TIMEOUT_SECONDS=${POC_S3_UPLOAD_QUEUE_TIMEOUT_SECONDS:-20}
    logging:
      driver: json-file
      options:
        max-size: "10m"   # rotate at 10 MB
        max-file: "3"     # keep 3 files (~30 MB max) to protect the SD card
    mem_limit: 921m
    memswap_limit: 921m
